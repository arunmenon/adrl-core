[project]
name = "adrl"
version = "0.1.0"
description = "ADRL: Adaptive Routing Layer between a coding harness and a model gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "starlette>=0.41",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "detect-secrets>=1.5",
  "tokenizers>=0.20",
  "cryptography>=43",
  "typer>=0.12",
  "numpy>=2.0",
]

[project.optional-dependencies]
retrieval = ["model2vec>=0.3"]
learning = ["scikit-learn>=1.5"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]

[project.scripts]
adrl = "adrl.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adrl"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:adrl.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"src/adrl/cli/**" = ["B008"]
"src/adrl/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["adrl"]
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["detect_secrets.*", "model2vec.*", "tokenizers.*", "prometheus_client.*"]
ignore_missing_imports = true
