# detectors-v1 (ADRL-SAF-003). Tier membership is decided by measured precision, never by tool
# default. Precision figures here are PROVISIONAL until `adrl scan-measure` publishes results on a
# representative corpus; re-run quarterly and bump the version when tiers move.
version: detectors-v1
measured_on: null
generic_min_length: 16
generic_min_entropy_bits: 3.5
base64_min_length: 24
detectors:
  # first-party high-confidence formats
  - detector_id: aws_access_key
    tier: high_confidence
    provisional_precision: 0.95
  - detector_id: private_key_block
    tier: high_confidence
    provisional_precision: 0.98
  - detector_id: anthropic_api_key
    tier: high_confidence
    provisional_precision: 0.97
